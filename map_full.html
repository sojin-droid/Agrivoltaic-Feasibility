<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도 — 영농형 태양광 특구 후보</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/terms.js"></script>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:'Malgun Gothic',system-ui,sans-serif}
 #map{position:absolute;inset:0}
 nav{position:absolute;top:0;left:0;right:0;z-index:1200;background:#fff;border-bottom:1px solid #e2e8f0;
   display:flex;gap:16px;padding:9px 18px;font-size:14px}
 nav a{color:#1a202c;text-decoration:none;font-weight:600} nav a:hover{color:#2b6cb0} nav a.dim{color:#a0aec0;font-weight:400}
 nav a.active{color:#2b6cb0;border-bottom:2px solid #2b6cb0} nav a.cta{margin-left:auto;border:1.5px solid #2b3a55;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;color:#2b3a55}
 #panel{position:absolute;top:46px;right:10px;z-index:1100;background:#fff;border-radius:8px;
   box-shadow:0 1px 10px rgba(0,0,0,.25);width:330px;font-size:12.5px;line-height:1.55;max-height:calc(100vh - 58px);overflow-y:auto;padding:12px 14px}
 h1{font-size:15px;margin:0 0 8px}
 select,button{font-size:12px;padding:3px 7px;border:1px solid #999;border-radius:5px;background:#f5f5f5;cursor:pointer;margin:2px 2px 2px 0}
 button.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
 .badge{padding:1px 9px;border-radius:9px;font-weight:700;font-size:12px}
 table{border-collapse:collapse;width:100%} td{padding:1px 5px 1px 0}
 hr{border:none;border-top:1px solid #e2e8f0;margin:8px 0}
 .seg{display:flex;justify-content:space-between;cursor:pointer;padding:1px 2px;border-bottom:1px dotted #eee}
 .seg:hover{background:#ebf4ff} .mut{color:#718096}
 details.grp summary{cursor:pointer;padding:2px 0;font-weight:600}
 .area-lbl{background:rgba(229,62,62,.92);color:#fff;border:none;font-weight:700;font-size:12px;box-shadow:none}
 .area-lbl::before{display:none}
 /* iframe(map.html 블록지도)로 삽입되면 자체 nav 숨김 — 단독 페이지에서는 그대로 표시 */
 html.embedded nav{display:none} html.embedded #panel{top:10px}
</style>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embedded')}catch(e){document.documentElement.classList.add('embedded')}</script>
</head><body>
<nav>
 <a href="index.html" data-m="navOv">개요</a><a class="active" href="map.html" data-m="navMap">지도</a><a href="atlas.html" data-m="navAtlas">구역별 지도</a><a href="method.html" data-m="navMethod">방법론</a>
 <a href="insight.html" data-m="navInsight">인사이트</a><a href="about.html" data-m="navAbout">영농형 태양광이란</a><a class="cta" href="index.html#contact">Contact</a>
</nav>
<div id="map"></div>
<div id="panel">
 <div id="explore-banner" style="display:none;background:#fefcbf;border:1px solid #d69e2e;color:#744210;border-radius:6px;padding:5px 8px;margin-bottom:7px;font-size:12px;font-weight:600"></div>
 <h1 id="ttl" data-m="selectSgg">시군 선택</h1>
 <div><b data-m="sgg">시군</b> <select id="sggSel"></select></div>
 <div style="margin-top:6px"><b data-m="scenario">시나리오</b>
   <button class="scn on" data-v="S1" data-m="scnS1">재생에너지지구 S1</button>
   <button class="scn" data-v="S2" data-m="scnS2">확장 S2</button>
   <button class="scn" data-v="S0" data-m="scnS0">현행 S0</button></div>
 <div style="margin-top:6px"><b data-m="choroLabel">계통 여유 단계구분도</b>
   <button id="choroBtn" data-m="choroOn">읍면동 색칠 켜기</button>
   <div id="legend" style="display:none;margin-top:3px"></div></div>
 <div style="margin-top:6px"><b data-m="tcap">개인소유 비율 상한</b>
   <span id="tbtns"></span></div>
 <table id="stat" style="margin-top:6px"></table>
 <div id="judge"></div>
 <hr>
 <div id="card" style="background:#f7fafc;border:1px solid #cbd5e0;border-radius:6px;padding:7px 9px"></div>
 <hr>
 <b data-m="priority">우선 검토 후보</b> <span class="mut" data-m="prioritySub">개인소유 낮은 순 · 클릭 이동</span>
 <div id="rank" style="max-height:260px;overflow-y:auto;margin-top:3px"></div>
 <details style="margin-top:5px"><summary id="unkSum" class="mut" style="cursor:pointer"></summary>
   <div id="unkList" style="max-height:120px;overflow-y:auto"></div></details>
</div>
<script>
const T=window.TERMS;
/* ── 언어 (map.html iframe이 ?lang= 로 전달) + UI 사전 + 시군명 로마자 ── */
const LANG=(new URLSearchParams(location.search).get('lang')==='en')?'en':'ko';
window.__curLang=LANG; document.documentElement.lang=LANG;
const ROMAN={'44270':'Dangjin','44180':'Boryeong','44200':'Asan','44130':'Cheonan','44210':'Seosan','44800':'Hongseong','41590':'Hwaseong','41220':'Pyeongtaek','41460':'Yongin','41270':'Ansan','41390':'Siheung','41500':'Icheon','41480':'Paju','41570':'Gimpo','44810':'Yesan','28200':'Incheon-Namdong','46230':'Gwangyang','46130':'Yeosu','47110':'Pohang','47190':'Gumi','31000':'Ulsan'};
const NM=k=>(LANG==='en'&&ROMAN[k])?ROMAN[k]:SUM.codes[k].name;
const HOW_EN={'무분할':'no split','①리':'① admin-ri','②소유+병합':'② ownership+merge','③콤팩트':'③ compactness','하위구획':'subdivision'};
const howL=h=>(LANG==='en'&&HOW_EN[h])?HOW_EN[h]:h;
const M={
  ko:{
    navOv:'개요',navMap:'지도',navAtlas:'구역별 지도',navMethod:'방법론',navInsight:'인사이트',navAbout:'영농형 태양광이란',
    title:'지도 — 영농형 태양광 특구 후보',
    selectSgg:'시군 선택', sgg:'시군', scenario:'시나리오',
    scnS1:'재생에너지지구 S1', scnS2:'확장 S2', scnS0:'현행 S0',
    choroLabel:'계통 여유 단계구분도', choroOn:'읍면동 색칠 켜기', choroOff:'읍면동 색칠 끄기',
    tcap:'개인소유 비율 상한', priority:'우선 검토 후보', prioritySub:'개인소유 낮은 순 · 클릭 이동',
    noListed:'등재 구획 없음', toColl:'수집 예정',
    ttlSuffix:n=>`${n} — 특구 후보`,
    loadFail:(sgg,scn)=>`⚠ <b>${sgg}_${scn}.json 로드 실패</b> — 강력 새로고침(Ctrl+F5) 후에도 반복되면 로컬 서버 실행 여부를 확인하세요. (병합 개편으로 사라진 구 코드가 캐시에 남은 경우일 수 있음)`,
    exploring:(tt,mw)=>`탐색 중 (개인소유 비율 상한 ${Math.round(tt*100)}%) — 공식 판정은 <b>30% 기준</b> · 공식 실행 <b>${mw}MW</b>`,
    statRow:(exp,tt,n,mw)=>`<tr><td>${exp?'탐색':'공식'} 집계(개인소유 ≤${Math.round(tt*100)}% · 미확인 ≤20%)</td><td><b>${n}</b>구획 · <b>${mw} MW</b></td></tr>`,
    judge:(badge,mw,thr)=>`공식 판정: ${badge} · 실행 ${mw}MW <span class="mut">(개인소유 30%)</span> · 50MW 통과 최소 개인소유 비율 ${thr==='—'?'—':Math.round(thr*100)+'%'}`,
    lbl:(bid,loc,ha,mw,n)=>`블록 ${bid} · ${loc} · <b>${ha}ha · ${mw}MW</b> <span class="mut">(${n}필지)</span>`,
    popSub:(sub,parent,how)=>sub?`하위구획 — 모블록 #${parent}이 소유 조건 탈락일 때 대신 집계`:`분할: ${how}`,
    popOwn:(iv,uk)=>`개인소유 ${iv}% · 미확인 ${uk}%`,
    gtxt:(pool,capped)=>pool!=null?`<br>계통 여유(동): <b>${pool}MW</b>${capped?' (설비한도 근접)':''}`:'<br>계통: 수집 예정',
    rankGrp:(rk,loc0,block,len,tot,iv,jump)=>`<b>${rk}.</b> ${loc0} 모블록 #${block} — ${len}구획·${tot}MW·최저 개인 ${iv}% ${jump}`,
    rankOne:(rk,lbl,iv)=>`<span><b>${rk}.</b> ${lbl}</span><span>개인 <b>${iv}%</b></span>`,
    rankRow:(lbl,iv,uk)=>`<span>${lbl}</span><span>개인 <b>${iv}%</b>·미확인 ${uk}%</span>`,
    jump:'[이동]',
    unkSum:cnt=>`소유 확인 필요 (${cnt}) — 미확인 >20%`,
    cxTip:(nm,mw)=>`🏭 ${nm}${mw?' · 첨두 '+mw+'MW':''}`,
    choroTip:(nm,p,u,capped)=>`<b>${nm}</b><br>추가 접속 가능 <b>${p}MW</b> · 표준 설치단위 약 ${u}개 분${capped?'<br>(설비한도 근접)':''}`,
    legTitle:'읍면동 추가 접속 가능(MW)',
    legNote1:'색=여유용량 5분위 · 진할수록 여유 큼 · 표준단위 3MW 기준',
    legNote2:'⚠ 읍면동 개별 여유 — 인접 동 합산은 상위설비 공유로 실계통과 다를 수 있음',
    choroFail:'⚠ 계통 지도(grid_choropleth.json) 로드 실패 — 강력 새로고침(Ctrl+F5) 또는 서버 확인',
    cardTitle:nm=>`<b>${nm} 요약</b>`, bTag:'(B 산단 거점)',
    c1:(s1,s2,s0)=>`① 잠재 물량: S1 ${s1}MW / S2 ${s2}MW / S0 ${s0}MW`,
    c2:d=>`② 연간 수요: ${d}`,
    c3:(g,u)=>`③ 계통 여유(읍면동 합): ${g}${u}`,
    units:n=>` (표준단위 ${n}개분)`,
    c4:'④ 시설재배(지붕형 후보): <span class="mut">실증 계수 확보 후 별도 산정 — 노지 산식 미적용</span>',
    cardNote:need=>`<span class="mut" style="font-size:11px">계통=한전 배전선로 여유. 동간 재분배 미수행 — 합산은 상한 추정. ${need?'이 시군은 계통 데이터 수집 예정.':''}</span>`
  },
  en:{
    navOv:'Overview',navMap:'Map',navAtlas:'Atlas',navMethod:'Method',navInsight:'Insight',navAbout:'About',
    title:'Map — agrivoltaic special-district candidates',
    selectSgg:'Select a city/county', sgg:'City/county', scenario:'Scenario',
    scnS1:'Renewable Energy District S1', scnS2:'Expanded S2', scnS0:'Current S0',
    choroLabel:'Grid-headroom choropleth', choroOn:'Township shading on', choroOff:'Township shading off',
    tcap:'Individual-ownership cap', priority:'Priority candidates', prioritySub:'lowest individual ownership · click to jump',
    noListed:'No listed segments', toColl:'to be collected',
    ttlSuffix:n=>`${n} — district candidates`,
    loadFail:(sgg,scn)=>`⚠ <b>Failed to load ${sgg}_${scn}.json</b> — if it persists after a hard refresh (Ctrl+F5), check whether the local server is running. (An old code removed in the merge revision may remain cached.)`,
    exploring:(tt,mw)=>`Exploring (individual-ownership cap ${Math.round(tt*100)}%) — official verdict uses the <b>30% basis</b> · official executable <b>${mw}MW</b>`,
    statRow:(exp,tt,n,mw)=>`<tr><td>${exp?'Exploring':'Official'} count (individual ≤${Math.round(tt*100)}% · unverified ≤20%)</td><td><b>${n}</b> segments · <b>${mw} MW</b></td></tr>`,
    judge:(badge,mw,thr)=>`Official verdict: ${badge} · executable ${mw}MW <span class="mut">(30% ownership)</span> · min ownership to clear 50MW = ${thr==='—'?'—':Math.round(thr*100)+'%'}`,
    lbl:(bid,loc,ha,mw,n)=>`Block ${bid} · ${loc} · <b>${ha}ha · ${mw}MW</b> <span class="mut">(${n} parcels)</span>`,
    popSub:(sub,parent,how)=>sub?`Subdivision — counted instead when parent block #${parent} fails the ownership test`:`Split: ${how}`,
    popOwn:(iv,uk)=>`individual ownership ${iv}% · unverified ${uk}%`,
    gtxt:(pool,capped)=>pool!=null?`<br>Grid headroom (township): <b>${pool}MW</b>${capped?' (near equipment cap)':''}`:'<br>Grid: to be collected',
    rankGrp:(rk,loc0,block,len,tot,iv,jump)=>`<b>${rk}.</b> ${loc0} parent block #${block} — ${len} segments·${tot}MW·min individual ${iv}% ${jump}`,
    rankOne:(rk,lbl,iv)=>`<span><b>${rk}.</b> ${lbl}</span><span>indiv <b>${iv}%</b></span>`,
    rankRow:(lbl,iv,uk)=>`<span>${lbl}</span><span>indiv <b>${iv}%</b>·unverified ${uk}%</span>`,
    jump:'[jump]',
    unkSum:cnt=>`Ownership check needed (${cnt}) — unverified >20%`,
    cxTip:(nm,mw)=>`🏭 ${nm}${mw?' · peak '+mw+'MW':''}`,
    choroTip:(nm,p,u,capped)=>`<b>${nm}</b><br>additional connectable <b>${p}MW</b> · ~${u} standard install units${capped?'<br>(near equipment cap)':''}`,
    legTitle:'Township additional connectable (MW)',
    legNote1:'color = headroom quintile · darker = more headroom · standard unit 3MW basis',
    legNote2:'⚠ Per-township headroom — summing adjacent townships may differ from the real grid due to shared upstream equipment',
    choroFail:'⚠ Failed to load grid map (grid_choropleth.json) — hard refresh (Ctrl+F5) or check server',
    cardTitle:nm=>`<b>${nm} summary</b>`, bTag:'(B industrial-complex hub)',
    c1:(s1,s2,s0)=>`① Potential capacity: S1 ${s1}MW / S2 ${s2}MW / S0 ${s0}MW`,
    c2:d=>`② Annual demand: ${d}`,
    c3:(g,u)=>`③ Grid headroom (township sum): ${g}${u}`,
    units:n=>` (${n} standard units)`,
    c4:'④ Protected cultivation (rooftop candidate): <span class="mut">separate estimate after field coefficients — open-field formula not applied</span>',
    cardNote:need=>`<span class="mut" style="font-size:11px">Grid = KEPCO distribution-line headroom. No inter-township redistribution — the sum is an upper-bound estimate. ${need?'Grid data for this city/county is to be collected.':''}</span>`
  }
};
const ML=()=>M[LANG];
function applyStatic(){
  document.title=ML().title;
  document.querySelectorAll('[data-m]').forEach(el=>{el.innerHTML=ML()[el.getAttribute('data-m')];});
}
let SUM,GRID,SGG=(new URLSearchParams(location.search).get('sgg'))||'44270',SCN='S1',TT=0.30,DATA,polys=[];
const map=L.map('map').setView([36.9,126.8],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OSM',maxZoom:19}).addTo(map);
const grp=L.featureGroup().addTo(map);
applyStatic();
const col=mw=>mw<5?'#c6dbef':mw<10?'#6baed6':mw<30?'#2171b5':'#08306b';
// 면적·MW를 주 지표로, 필지 수는 괄호 부차 (2026-07-16 UX — 필지 적음이 MW 오해 방지)
const lbl=r=>ML().lbl(r.bid,r.loc,r.ha,r.mw,r.n.toLocaleString());

// 산단 위치 마커 (공장 아이콘, 반경 아님 — 위치만) — 블록·계통 위에 표시
const factoryIcon=L.divIcon({html:'<div style="font-size:16px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))">🏭</div>',className:'',iconSize:[16,16],iconAnchor:[8,8]});
let cxLayer=null;
fetch('data/complexes.json').then(r=>r.json()).then(cx=>{
  cxLayer=L.layerGroup(cx.map(c=>L.marker([c.lat,c.lon],{icon:factoryIcon,zIndexOffset:1000})
    .bindTooltip(ML().cxTip(c.name,c.mw)))).addTo(map);
});
Promise.all([fetch('data/summary.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/grid_dong.json',{cache:'no-cache'}).then(r=>r.json())])
.then(([s,g])=>{SUM=s;GRID=g;
  // 시군 드롭다운 = 전체 30(29)코드, A/B optgroup 분리
  const mkOpt=k=>`<option value="${k}"${k===SGG?' selected':''}>${NM(k)}</option>`;
  const byMw=(a,b)=>(SUM.codes[b].S1.b_mw_t30||0)-(SUM.codes[a].S1.b_mw_t30||0);
  const A=Object.keys(SUM.codes).filter(k=>SUM.codes[k].region==='A').sort(byMw);
  const B=Object.keys(SUM.codes).filter(k=>SUM.codes[k].region==='B').sort(byMw);
  const grpA=LANG==='en'?'A · Gyeonggi·Chungnam':'A · 경기·충남';
  const grpB=LANG==='en'?'B · National industrial-complex hubs':'B · 전국 산단거점';
  document.getElementById('sggSel').innerHTML=
    `<optgroup label="${grpA}">${A.map(mkOpt).join('')}</optgroup>`+
    `<optgroup label="${grpB}">${B.map(mkOpt).join('')}</optgroup>`;
  document.getElementById('tbtns').innerHTML=[0.10,0.20,0.30,0.40,0.50].map(t=>`<button class="tf${t===0.30?' on':''}" data-v="${t}">${Math.round(t*100)}%</button>`).join('');
  load();});

function load(){
  fetch(`data/${SGG}_${SCN}.json`,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{DATA=j;build();})
    .catch(()=>{DATA={records:[],summary:{}};build();
      // 무음 빈 지도 방지 (2026-07-22): 로드 실패를 화면에 명시 — 구본 캐시(사라진 코드)·서버 중단이 주 원인
      const eb=document.getElementById('explore-banner');eb.style.display='block';
      eb.innerHTML=ML().loadFail(SGG,SCN);});
}
function build(){
  grp.clearLayers();polys=[];
  DATA.records.forEach(r=>{
    const p=L.polygon(r.poly.map(g=>g.map(q=>[q[1],q[0]])),
      r.sub?{color:'#276749',weight:1.5,dashArray:'4 3',fillColor:'#48bb78',fillOpacity:.5}
           :{color:col(r.mw),weight:1.2,fillColor:col(r.mw),fillOpacity:.5});
    const dong=GRID[String(r.ri).slice(0,8)]; // 2026-07-22 수정: GRID 키=8자리 읍면동, r.ri=10자리 법정동리 — 절단 조회 (구본은 항상 미스여서 '수집 예정'만 표시되던 잠복 버그)
    const gtxt=ML().gtxt(dong?dong.pool_mw:null, dong&&dong.capped);
    p.bindPopup(`${lbl(r)}<br>${ML().popSub(r.sub,r.parent,howL(r.how))}<br>${ML().popOwn(r.indiv!=null?(r.indiv*100).toFixed(1):'?',(r.unk*100).toFixed(1))}${gtxt}`);
    // hover: 외곽선 굵게 + 면적 라벨 순간 표시 ("작아 보여도 100ha" 즉각 전달, 줌 유지)
    p.on('mouseover',function(){const c=this._r;this._pw=this.options.weight;
      this.setStyle({weight:3.5,color:'#e53e3e'});this.bringToFront();
      this.bindTooltip(`${c.ha}ha · ${c.mw}MW`,{permanent:true,direction:'center',className:'area-lbl'}).openTooltip();});
    p.on('mouseout',function(){this.setStyle({weight:this._pw||1.2,color:this._r.sub?'#276749':col(this._r.mw)});
      this.unbindTooltip();});
    p._r=r;p.addTo(grp);polys.push(p);});
  if(polys.length)map.fitBounds(grp.getBounds());
  document.getElementById('ttl').textContent=ML().ttlSuffix(NM(SGG));
  refresh();card();
}
function refresh(){
  const passP={};polys.forEach(p=>{const r=p._r;if(!r.sub)passP[r.bid]=(r.unk<=0.20&&r.indiv!=null&&r.indiv<=TT);});
  let n=0,mw=0;const vis=[];
  polys.forEach(p=>{const r=p._r;const ok=r.sub?!passP[r.parent]:passP[r.bid];
    if(ok){n++;mw+=r.mw;vis.push(r);}
    p.setStyle(ok?{opacity:1,fillOpacity:.55}:{opacity:r.sub?0:.12,fillOpacity:r.sub?0:.05});});
  const s=SUM.codes[SGG][SCN]||{};
  const isB=SUM.codes[SGG].region==='B';
  const exploring=Math.abs(TT-0.30)>1e-6;
  // 탐색/공식 혼동 차단: t≠0.30이면 경고 배너 + 공식값 병기 상시
  const eb=document.getElementById('explore-banner');
  if(exploring){eb.style.display='block';
    eb.innerHTML=ML().exploring(TT,T.mw(s.b_mw_t30));}
  else eb.style.display='none';
  document.getElementById('stat').innerHTML=ML().statRow(exploring,TT,n,T.mw(mw));
  document.getElementById('judge').innerHTML=ML().judge(T.statusBadge(s.status_t30),T.mw(s.b_mw_t30),s.threshold_t_50||'—')+
    (isB&&s.status_t30==='요건 미달'?`<br><span class="mut">${T.bFrame()}</span>`:'');
  const g={};vis.forEach(r=>{(g[r.block]=g[r.block]||[]).push(r);});
  const groups=Object.values(g).map(a=>a.sort((x,y)=>x.indiv-y.indiv)).sort((a,b)=>a[0].indiv-b[0].indiv);
  const row=r=>`<div class="seg" data-b="${r.bid}">${ML().rankRow(lbl(r),(r.indiv*100).toFixed(1),(r.unk*100).toFixed(1))}</div>`;
  let rk=0;
  document.getElementById('rank').innerHTML=groups.slice(0,25).map(a=>{rk++;
    if(a.length===1)return `<div class="seg" data-b="${a[0].bid}">${ML().rankOne(rk,lbl(a[0]),(a[0].indiv*100).toFixed(1))}</div>`;
    const tot=a.reduce((s,r)=>s+r.mw,0);
    const jump=`<span class="seg" data-b="${a[0].bid}" style="display:inline;color:#2b6cb0">${ML().jump}</span>`;
    return `<details class="grp"><summary>${ML().rankGrp(rk,a[0].loc.split(' ')[0],a[0].block,a.length,T.mw(tot),(a[0].indiv*100).toFixed(1),jump)}</summary>${a.map(row).join('')}</details>`;
  }).join('')||`<span class="mut">${ML().noListed}</span>`;
  const fl=polys.map(p=>p._r).filter(r=>r.unk>0.20);
  document.getElementById('unkSum').textContent=ML().unkSum(fl.length);
  document.getElementById('unkList').innerHTML=fl.sort((a,b)=>b.unk-a.unk).map(row).join('');
  document.querySelectorAll('.seg').forEach(el=>el.onclick=()=>{const p=polys.find(q=>q._r.bid==el.dataset.b);if(p){map.fitBounds(p.getBounds().pad(0.4));p.openPopup();}});
}
function card(){
  const c=SUM.codes[SGG];
  const gridMW=c.grid_pool_mw!=null?`${T.mw(c.grid_pool_mw)}MW`:`<span class="mut">${ML().toColl}</span>`;
  const units=c.grid_pool_mw!=null?ML().units(Math.floor(c.grid_pool_mw/T.UNIT.mw)):'';
  document.getElementById('card').innerHTML=
   `${ML().cardTitle(NM(SGG))} <span class="mut">${c.region==='B'?ML().bTag:''}</span><br>`+
   ML().c1(T.mw((c.S1||{}).seg_mw),T.mw((c.S2||{}).seg_mw),T.mw((c.S0||{}).seg_mw))+'<br>'+
   ML().c2(c.demand_gwh!=null?T.mw(c.demand_gwh)+'GWh':`<span class="mut">${ML().toColl}</span>`)+'<br>'+
   ML().c3(gridMW,units)+'<br>'+
   ML().c4+'<br>'+
   ML().cardNote(c.grid_pool_mw==null);
}
// 계통 여유 단계구분도 (읍면동 pool_mw, 분위 5단계)
// 여유 클수록 진한 초록 (2026-07-16 반전 — "진할수록 접속 여유 많음" 직관)
const CH_BRK=[6,12,19,46], CH_COL=['#edf8e9','#bae4b3','#74c476','#31a354','#006d2c'];
const chColor=v=>v==null?'#eee':v<CH_BRK[0]?CH_COL[0]:v<CH_BRK[1]?CH_COL[1]:v<CH_BRK[2]?CH_COL[2]:v<CH_BRK[3]?CH_COL[3]:CH_COL[4];
let choLayer=null,choOn=false;
function toggleChoro(){
  choOn=!choOn;
  document.getElementById('choroBtn').classList.toggle('on',choOn);
  document.getElementById('choroBtn').textContent=choOn?ML().choroOff:ML().choroOn;
  document.getElementById('legend').style.display=choOn?'block':'none';
  if(choOn && !choLayer){
    fetch('data/grid_choropleth.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(fc=>{
      choLayer=L.geoJSON(fc,{style:f=>({fillColor:chColor(f.properties.pool_mw),weight:.6,color:'#fff',fillOpacity:.6}),
        onEachFeature:(f,l)=>{const p=f.properties.pool_mw,u=Math.floor(p/T.UNIT.mw);
          l.bindTooltip(ML().choroTip(f.properties.name,p,u,f.properties.capped));}});
      if(choOn){choLayer.addTo(map);choLayer.bringToBack();}  // 로딩 중 꺼짐 클릭 시 유령 표시 방지
    }).catch(()=>{  // 무음 실패 방지 (2026-07-22): 버튼 상태 복원 + 범례에 실패 사유 표시
      choOn=false;choLayer=null;
      document.getElementById('choroBtn').classList.remove('on');
      document.getElementById('choroBtn').textContent=ML().choroOn;
      document.getElementById('legend').style.display='block';
      document.getElementById('legend').innerHTML=`<span class="mut">${ML().choroFail}</span>`;});
  } else if(choLayer){ choOn?choLayer.addTo(map):map.removeLayer(choLayer); if(choOn)choLayer.bringToBack(); }
  const brk=['~6','6–12','12–19','19–46','46+'];
  document.getElementById('legend').innerHTML=`<span class="mut">${ML().legTitle}</span><br>`+
    brk.map((b,i)=>`<span style="display:inline-block;width:12px;height:12px;background:${CH_COL[i]};vertical-align:middle"></span> ${b} `).join('')+
    `<br><span class="mut" style="font-size:11px">${ML().legNote1}</span>`+
    `<br><span class="mut" style="font-size:11px">${ML().legNote2}</span>`;
}
document.getElementById('choroBtn').onclick=toggleChoro;
document.addEventListener('click',e=>{
  if(e.target.classList.contains('scn')){document.querySelectorAll('.scn').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');SCN=e.target.dataset.v;load();}
  if(e.target.classList.contains('tf')){document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');TT=parseFloat(e.target.dataset.v);refresh();}
});
document.getElementById('sggSel').addEventListener('change',e=>{SGG=e.target.value;load();});
</script></body></html>
