<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도 — 영농형 태양광 특구 후보</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/terms.js"></script>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:'Malgun Gothic',system-ui,sans-serif}
 #map{position:absolute;inset:0}
 nav{position:absolute;top:0;left:0;right:0;z-index:1200;background:#fff;border-bottom:1px solid #e2e8f0;
   display:flex;gap:16px;padding:9px 18px;font-size:14px}
 nav a{color:#1a202c;text-decoration:none;font-weight:600} nav a:hover{color:#2b6cb0} nav a.dim{color:#a0aec0;font-weight:400}
 #panel{position:absolute;top:46px;right:10px;z-index:1100;background:#fff;border-radius:8px;
   box-shadow:0 1px 10px rgba(0,0,0,.25);width:330px;font-size:12.5px;line-height:1.55;max-height:calc(100vh - 58px);overflow-y:auto;padding:12px 14px}
 h1{font-size:15px;margin:0 0 8px}
 select,button{font-size:12px;padding:3px 7px;border:1px solid #999;border-radius:5px;background:#f5f5f5;cursor:pointer;margin:2px 2px 2px 0}
 button.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
 .badge{padding:1px 9px;border-radius:9px;font-weight:700;font-size:12px}
 table{border-collapse:collapse;width:100%} td{padding:1px 5px 1px 0}
 hr{border:none;border-top:1px solid #e2e8f0;margin:8px 0}
 .seg{display:flex;justify-content:space-between;cursor:pointer;padding:1px 2px;border-bottom:1px dotted #eee}
 .seg:hover{background:#ebf4ff} .mut{color:#718096}
 details.grp summary{cursor:pointer;padding:2px 0;font-weight:600}
 .area-lbl{background:rgba(229,62,62,.92);color:#fff;border:none;font-weight:700;font-size:12px;box-shadow:none}
 .area-lbl::before{display:none}
</style></head><body>
<nav>
 <a href="index.html">개요</a><a href="map.html">지도</a><a href="method.html">방법론</a>
 <a href="insight.html">인사이트</a><a class="dim" href="#" title="법률 감수 후 공개">정책 제언 (준비중)</a>
</nav>
<div id="map"></div>
<div id="panel">
 <div id="explore-banner" style="display:none;background:#fefcbf;border:1px solid #d69e2e;color:#744210;border-radius:6px;padding:5px 8px;margin-bottom:7px;font-size:12px;font-weight:600"></div>
 <h1 id="ttl">시군 선택</h1>
 <div><b>시군</b> <select id="sggSel"></select></div>
 <div style="margin-top:6px"><b>시나리오</b>
   <button class="scn on" data-v="S1">재생에너지지구 S1</button>
   <button class="scn" data-v="S2">확장 S2</button>
   <button class="scn" data-v="S0">현행 S0</button></div>
 <div style="margin-top:6px"><b>계통 여유 단계구분도</b>
   <button id="choroBtn">읍면동 색칠 켜기</button>
   <div id="legend" style="display:none;margin-top:3px"></div></div>
 <div style="margin-top:6px"><b>개인소유 상한 t</b>
   <span id="tbtns"></span></div>
 <table id="stat" style="margin-top:6px"></table>
 <div id="judge"></div>
 <hr>
 <div id="card" style="background:#f7fafc;border:1px solid #cbd5e0;border-radius:6px;padding:7px 9px"></div>
 <hr>
 <b>우선 검토 후보</b> <span class="mut">개인소유 낮은 순 · 클릭 이동</span>
 <div id="rank" style="max-height:260px;overflow-y:auto;margin-top:3px"></div>
 <details style="margin-top:5px"><summary id="unkSum" class="mut" style="cursor:pointer"></summary>
   <div id="unkList" style="max-height:120px;overflow-y:auto"></div></details>
</div>
<script>
const T=window.TERMS;
let SUM,GRID,SGG=(new URLSearchParams(location.search).get('sgg'))||'44270',SCN='S1',TT=0.30,DATA,polys=[];
const map=L.map('map').setView([36.9,126.8],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OSM',maxZoom:19}).addTo(map);
const grp=L.featureGroup().addTo(map);
const col=mw=>mw<5?'#c6dbef':mw<10?'#6baed6':mw<30?'#2171b5':'#08306b';
// 면적·MW를 주 지표로, 필지 수는 괄호 부차 (2026-07-16 UX — 필지 적음이 MW 오해 방지)
const lbl=r=>`블록 ${r.bid} · ${r.loc} · <b>${r.ha}ha · ${r.mw}MW</b> <span class="mut">(${r.n.toLocaleString()}필지)</span>`;

// 산단 위치 마커 (공장 아이콘, 반경 아님 — 위치만) — 블록·계통 위에 표시
const factoryIcon=L.divIcon({html:'<div style="font-size:16px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))">🏭</div>',className:'',iconSize:[16,16],iconAnchor:[8,8]});
let cxLayer=null;
fetch('data/complexes.json').then(r=>r.json()).then(cx=>{
  cxLayer=L.layerGroup(cx.map(c=>L.marker([c.lat,c.lon],{icon:factoryIcon,zIndexOffset:1000})
    .bindTooltip(`🏭 ${c.name}${c.mw?' · 첨두 '+c.mw+'MW':''}`))).addTo(map);
});
Promise.all([fetch('data/summary.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/grid_dong.json',{cache:'no-cache'}).then(r=>r.json())])
.then(([s,g])=>{SUM=s;GRID=g;
  // 시군 드롭다운 = 전체 30(29)코드, A/B optgroup 분리
  const mkOpt=k=>`<option value="${k}"${k===SGG?' selected':''}>${SUM.codes[k].name}</option>`;
  const byMw=(a,b)=>(SUM.codes[b].S1.b_mw_t30||0)-(SUM.codes[a].S1.b_mw_t30||0);
  const A=Object.keys(SUM.codes).filter(k=>SUM.codes[k].region==='A').sort(byMw);
  const B=Object.keys(SUM.codes).filter(k=>SUM.codes[k].region==='B').sort(byMw);
  document.getElementById('sggSel').innerHTML=
    `<optgroup label="A · 경기·충남">${A.map(mkOpt).join('')}</optgroup>`+
    `<optgroup label="B · 전국 산단거점">${B.map(mkOpt).join('')}</optgroup>`;
  document.getElementById('tbtns').innerHTML=[0.10,0.20,0.30,0.40,0.50].map(t=>`<button class="tf${t===0.30?' on':''}" data-v="${t}">${t.toFixed(2)}</button>`).join('');
  load();});

function load(){
  fetch(`data/${SGG}_${SCN}.json`,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{DATA=j;build();})
    .catch(()=>{DATA={records:[],summary:{}};build();
      // 무음 빈 지도 방지 (2026-07-22): 로드 실패를 화면에 명시 — 구본 캐시(사라진 코드)·서버 중단이 주 원인
      const eb=document.getElementById('explore-banner');eb.style.display='block';
      eb.innerHTML=`⚠ <b>${SGG}_${SCN}.json 로드 실패</b> — 강력 새로고침(Ctrl+F5) 후에도 반복되면 로컬 서버 실행 여부를 확인하세요. (병합 개편으로 사라진 구 코드가 캐시에 남은 경우일 수 있음)`;});
}
function build(){
  grp.clearLayers();polys=[];
  DATA.records.forEach(r=>{
    const p=L.polygon(r.poly.map(g=>g.map(q=>[q[1],q[0]])),
      r.sub?{color:'#276749',weight:1.5,dashArray:'4 3',fillColor:'#48bb78',fillOpacity:.5}
           :{color:col(r.mw),weight:1.2,fillColor:col(r.mw),fillOpacity:.5});
    const dong=GRID[String(r.ri).slice(0,8)]; // 2026-07-22 수정: GRID 키=8자리 읍면동, r.ri=10자리 법정동리 — 절단 조회 (구본은 항상 미스여서 '수집 예정'만 표시되던 잠복 버그)
    const gtxt=dong?`<br>계통 여유(동): <b>${dong.pool_mw}MW</b>${dong.capped?' (설비한도 근접)':''}`:'<br>계통: 수집 예정';
    p.bindPopup(`${lbl(r)}<br>${r.sub?'하위구획 — 모블록 #'+r.parent+'이 소유 조건 탈락일 때 대신 집계':'분할: '+r.how}<br>개인소유 ${r.indiv!=null?(r.indiv*100).toFixed(1):'?'}% · 미확인 ${(r.unk*100).toFixed(1)}%${gtxt}`);
    // hover: 외곽선 굵게 + 면적 라벨 순간 표시 ("작아 보여도 100ha" 즉각 전달, 줌 유지)
    p.on('mouseover',function(){const c=this._r;this._pw=this.options.weight;
      this.setStyle({weight:3.5,color:'#e53e3e'});this.bringToFront();
      this.bindTooltip(`${c.ha}ha · ${c.mw}MW`,{permanent:true,direction:'center',className:'area-lbl'}).openTooltip();});
    p.on('mouseout',function(){this.setStyle({weight:this._pw||1.2,color:this._r.sub?'#276749':col(this._r.mw)});
      this.unbindTooltip();});
    p._r=r;p.addTo(grp);polys.push(p);});
  if(polys.length)map.fitBounds(grp.getBounds());
  document.getElementById('ttl').textContent=`${SUM.codes[SGG].name} — 특구 후보`;
  refresh();card();
}
function refresh(){
  const passP={};polys.forEach(p=>{const r=p._r;if(!r.sub)passP[r.bid]=(r.unk<=0.20&&r.indiv!=null&&r.indiv<=TT);});
  let n=0,mw=0;const vis=[];
  polys.forEach(p=>{const r=p._r;const ok=r.sub?!passP[r.parent]:passP[r.bid];
    if(ok){n++;mw+=r.mw;vis.push(r);}
    p.setStyle(ok?{opacity:1,fillOpacity:.55}:{opacity:r.sub?0:.12,fillOpacity:r.sub?0:.05});});
  const s=SUM.codes[SGG][SCN]||{};
  const isB=SUM.codes[SGG].region==='B';
  const exploring=Math.abs(TT-0.30)>1e-6;
  // 탐색/공식 혼동 차단: t≠0.30이면 경고 배너 + 공식값 병기 상시
  const eb=document.getElementById('explore-banner');
  if(exploring){eb.style.display='block';
    eb.innerHTML=`탐색 중 (개인소유 상한 ${TT}) — 공식 판정은 <b>30% 기준</b> · 공식 실행 <b>${T.mw(s.b_mw_t30)}MW</b>`;}
  else eb.style.display='none';
  document.getElementById('stat').innerHTML=`<tr><td>${exploring?'탐색':'공식'} 집계(개인 ≤${TT} · 미확인 ≤20%)</td><td><b>${n}</b>구획 · <b>${T.mw(mw)} MW</b></td></tr>`;
  document.getElementById('judge').innerHTML=`공식 판정: ${T.statusBadge(s.status_t30)} · 실행 ${T.mw(s.b_mw_t30)}MW <span class="mut">(t=0.30)</span> · 50MW 통과 최소 t=${s.threshold_t_50||'—'}`+
    (isB&&s.status_t30==='요건 미달'?`<br><span class="mut">${T.B_FRAME}</span>`:'');
  const g={};vis.forEach(r=>{(g[r.block]=g[r.block]||[]).push(r);});
  const groups=Object.values(g).map(a=>a.sort((x,y)=>x.indiv-y.indiv)).sort((a,b)=>a[0].indiv-b[0].indiv);
  const row=r=>`<div class="seg" data-b="${r.bid}"><span>${lbl(r)}</span><span>개인 <b>${(r.indiv*100).toFixed(1)}%</b>·미확인 ${(r.unk*100).toFixed(1)}%</span></div>`;
  let rk=0;
  document.getElementById('rank').innerHTML=groups.slice(0,25).map(a=>{rk++;
    if(a.length===1)return `<div class="seg" data-b="${a[0].bid}"><span><b>${rk}.</b> ${lbl(a[0])}</span><span>개인 <b>${(a[0].indiv*100).toFixed(1)}%</b></span></div>`;
    const tot=a.reduce((s,r)=>s+r.mw,0);
    return `<details class="grp"><summary><b>${rk}.</b> ${a[0].loc.split(' ')[0]} 모블록 #${a[0].block} — ${a.length}구획·${T.mw(tot)}MW·최저 개인 ${(a[0].indiv*100).toFixed(1)}% <span class="seg" data-b="${a[0].bid}" style="display:inline;color:#2b6cb0">[이동]</span></summary>${a.map(row).join('')}</details>`;
  }).join('')||'<span class="mut">등재 구획 없음</span>';
  const fl=polys.map(p=>p._r).filter(r=>r.unk>0.20);
  document.getElementById('unkSum').textContent=`소유 확인 필요 (${fl.length}) — 미확인 >20%`;
  document.getElementById('unkList').innerHTML=fl.sort((a,b)=>b.unk-a.unk).map(row).join('');
  document.querySelectorAll('.seg').forEach(el=>el.onclick=()=>{const p=polys.find(q=>q._r.bid==el.dataset.b);if(p){map.fitBounds(p.getBounds().pad(0.4));p.openPopup();}});
}
function card(){
  const c=SUM.codes[SGG];
  const gridMW=c.grid_pool_mw!=null?`${T.mw(c.grid_pool_mw)}MW`:'<span class="mut">수집 예정</span>';
  const units=c.grid_pool_mw!=null?` (표준단위 ${Math.floor(c.grid_pool_mw/T.UNIT.mw)}개분)`:'';
  document.getElementById('card').innerHTML=
   `<b>${c.name} 요약</b> <span class="mut">${c.region==='B'?'(B 산단 거점)':''}</span><br>`+
   `① 잠재 물량: S1 ${T.mw((c.S1||{}).seg_mw)}MW / S2 ${T.mw((c.S2||{}).seg_mw)}MW / S0 ${T.mw((c.S0||{}).seg_mw)}MW<br>`+
   `② 연간 수요: ${c.demand_gwh!=null?T.mw(c.demand_gwh)+'GWh':'<span class="mut">수집 예정</span>'}<br>`+
   `③ 계통 여유(읍면동 합): ${gridMW}${units}<br>`+
   `④ 시설재배(지붕형 후보): <span class="mut">실증 계수 확보 후 별도 산정 — 노지 산식 미적용</span><br>`+
   `<span class="mut" style="font-size:11px">계통=한전 배전선로 여유. 동간 재분배 미수행 — 합산은 상한 추정. `+
   (c.grid_pool_mw==null?'이 시군은 계통 데이터 수집 예정.':'')+`</span>`;
}
// 계통 여유 단계구분도 (읍면동 pool_mw, 분위 5단계)
// 여유 클수록 진한 초록 (2026-07-16 반전 — "진할수록 접속 여유 많음" 직관)
const CH_BRK=[6,12,19,46], CH_COL=['#edf8e9','#bae4b3','#74c476','#31a354','#006d2c'];
const chColor=v=>v==null?'#eee':v<CH_BRK[0]?CH_COL[0]:v<CH_BRK[1]?CH_COL[1]:v<CH_BRK[2]?CH_COL[2]:v<CH_BRK[3]?CH_COL[3]:CH_COL[4];
let choLayer=null,choOn=false;
function toggleChoro(){
  choOn=!choOn;
  document.getElementById('choroBtn').classList.toggle('on',choOn);
  document.getElementById('choroBtn').textContent=choOn?'읍면동 색칠 끄기':'읍면동 색칠 켜기';
  document.getElementById('legend').style.display=choOn?'block':'none';
  if(choOn && !choLayer){
    fetch('data/grid_choropleth.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(fc=>{
      choLayer=L.geoJSON(fc,{style:f=>({fillColor:chColor(f.properties.pool_mw),weight:.6,color:'#fff',fillOpacity:.6}),
        onEachFeature:(f,l)=>{const p=f.properties.pool_mw,u=Math.floor(p/T.UNIT.mw);
          l.bindTooltip(`<b>${f.properties.name}</b><br>추가 접속 가능 <b>${p}MW</b> · 표준 설치단위 약 ${u}개 분${f.properties.capped?'<br>(설비한도 근접)':''}`);}});
      if(choOn){choLayer.addTo(map);choLayer.bringToBack();}  // 로딩 중 꺼짐 클릭 시 유령 표시 방지
    }).catch(()=>{  // 무음 실패 방지 (2026-07-22): 버튼 상태 복원 + 범례에 실패 사유 표시
      choOn=false;choLayer=null;
      document.getElementById('choroBtn').classList.remove('on');
      document.getElementById('choroBtn').textContent='읍면동 색칠 켜기';
      document.getElementById('legend').style.display='block';
      document.getElementById('legend').innerHTML='<span class="mut">⚠ 계통 지도(grid_choropleth.json) 로드 실패 — 강력 새로고침(Ctrl+F5) 또는 서버 확인</span>';});
  } else if(choLayer){ choOn?choLayer.addTo(map):map.removeLayer(choLayer); if(choOn)choLayer.bringToBack(); }
  const brk=['~6','6–12','12–19','19–46','46+'];
  document.getElementById('legend').innerHTML='<span class="mut">읍면동 추가 접속 가능(MW)</span><br>'+
    brk.map((b,i)=>`<span style="display:inline-block;width:12px;height:12px;background:${CH_COL[i]};vertical-align:middle"></span> ${b} `).join('')+
    '<br><span class="mut" style="font-size:11px">색=여유용량 5분위 · 진할수록 여유 큼 · 표준단위 3MW 기준</span>'+
    '<br><span class="mut" style="font-size:11px">⚠ 읍면동 개별 여유 — 인접 동 합산은 상위설비 공유로 실계통과 다를 수 있음</span>';
}
document.getElementById('choroBtn').onclick=toggleChoro;
document.addEventListener('click',e=>{
  if(e.target.classList.contains('scn')){document.querySelectorAll('.scn').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');SCN=e.target.dataset.v;load();}
  if(e.target.classList.contains('tf')){document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');TT=parseFloat(e.target.dataset.v);refresh();}
});
document.getElementById('sggSel').addEventListener('change',e=>{SGG=e.target.value;load();});
</script></body></html>
