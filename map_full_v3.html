// 그룹 강조 (gid=null 이면 원복)
function groupFocus(gid){
  coreLayer.eachLayer(l=>{

    else if(l._c.gid===gid){l.setStyle({opacity:1,fillOpacity:.95,weight:3,color:'#00e5ff'});l.bringToFront();}
    else l.setStyle({opacity:.25,fillOpacity:.10,weight:1,color:'#222'});

// 그룹 선택 후 하위 레벨: 그룹 안에서 개별 구획 격리 (bid=null 이면 그룹 강조로)
function coreFocus(bid){
  coreLayer.eachLayer(l=>{
    if(!l._vis) return;
    if(l._c.gid!==grpSel){l.setStyle({opacity:.25,fillOpacity:.10,weight:1,color:'#222'});return;}
    if(bid==null) l.setStyle({opacity:1,fillOpacity:.95,weight:3,color:'#00e5ff'});
    else if(l._c.bid===bid){l.setStyle({opacity:1,fillOpacity:.98,weight:5,color:'#ffd700'});l.bringToFront();}

function refresh(){
  // 표시 범위 = 규모(MW) 기준. 소유는 관문이 아니라 순위(아래 목록 정렬)로만 반영
  let n=0,mw=0,alloc=0;const vis=[];
  polys.forEach(p=>{const r=p._r;const ok=((MWMIN===0)||(r.mw>=MWMIN))&&!coreOnly;
    if(ok){n++;mw+=r.mw;alloc+=(r.alloc||0);vis.push(r);}
    p.unbindTooltip(); // 이전 hover 라벨 잔상 제거
    p.setStyle(ok?{...outline(r),opacity:1,fillOpacity:.55}
                 :{...outline(r),opacity:coreOnly?0:.10,fillOpacity:coreOnly?0:.04});});
  drawCores();
  const s=SUM.codes[SGG][SCN]||{};
  const eb=document.getElementById('explore-banner');
  if(coreOnly){eb.style.display='block';
    eb.innerHTML=`<b style="color:#9b2c2c">개인소유 0% 구획만 표시 중</b> — 소유 무관 블록은 숨김. `+
      `같은 색 = 같은 그룹(간격 800m 이내). 지도나 목록을 한 번 클릭하면 그룹 전체가 선택됩니다.`;}
  else if(MWMIN!==0){eb.style.display='block';
    eb.innerHTML=`<b>${MWMIN}MW 이상</b>만 표시 중 — 시군 전체는 <b>${T.mw(s.seg_mw)}MW</b> (${s.seg_n}블록)`;}
  else eb.style.display='none';
  document.getElementById('stat').innerHTML=
    `<tr><td>표시 블록 (${MWMIN===0?'전체':MWMIN+'MW↑'})</td><td><b>${n}</b>블록 · <b>${T.mw(mw)} MW</b></td></tr>`+
    `<tr><td>시군 전체 (≥3MW)</td><td><b>${s.seg_n}</b>블록 · <b>${T.mw(s.seg_mw)} MW</b></td></tr>`+
    `<tr><td>50MW↑ / 100MW↑</td><td><b>${s.ge50_n}</b> / <b>${s.ge100_n}</b>개</td></tr>`+
    `<tr><td>1등급 / 1–3등급</td><td><b>${s.g1_n}</b>개 ${T.mw(s.g1_mw)}MW · <b>${s.g3_n}</b>개 ${T.mw(s.g3_mw)}MW</td></tr>`+
    (s.pool_mw!=null?`<tr><td>계통 여유 <span class="mut">(관내 읍면동)</span></td><td><b>${T.mw(s.pool_mw)}</b> MW</td></tr>`+
      `<tr><td>블록 배분 <span class="mut">(관외 동 포함)</span></td><td><b>${T.mw(s.alloc_mw)}</b> MW</td></tr>`:'');
  const cov=(s.pool_mw&&s.seg_mw)?(100*s.alloc_mw/s.seg_mw):null;
  document.getElementById('judge').innerHTML=
    `최대 블록 <b>${T.mw(s.max_mw)}MW</b> · 개인소유 중앙 <b>${s.indiv_med!=null?(s.indiv_med*100).toFixed(1)+'%':'—'}</b>`+
    (cov!=null?` · <span class="mut">계통 충족률 <b>${cov.toFixed(1)}%</b> (순위별 배분)</span>`:'');
  // 순위 목록 = 개인소유 비율 낮은 순 (같으면 규모 큰 순)
  const ord=vis.slice().sort((a,b)=>((a.indiv==null?9:a.indiv)-(b.indiv==null?9:b.indiv))||(b.mw-a.mw));
  const isAll=(SGG==='ALL');
  const row=(r,rk)=>`<div class="seg" data-b="${r.bid}">`+
    `<span>${rk?'<b>'+rk+'.</b> ':''}<b>${r.mw}MW</b> · ${isAll?r.sggs:r.loc}`+
    `<span class="mut"> ${isAll?r.loc:'('+r.ha+'ha)'}</span></span>`+
    `<span>개인 <b>${r.indiv!=null?(r.indiv*100).toFixed(0):'?'}%</b></span></div>`;
  document.getElementById('rank').innerHTML=ord.slice(0,40).map((r,i)=>row(r,i+1)).join('')
    ||`<span class="mut">${ML().noListed}</span>`;
  const fl=polys.map(p=>p._r).filter(r=>r.unk>0.20);
  document.getElementById('unkSum').textContent=ML().unkSum(fl.length);
  document.getElementById('unkList').innerHTML=fl.sort((a,b)=>b.unk-a.unk).map(r=>row(r,0)).join('');
  // 블록 목록 전용 (구획 목록 #coreList의 클릭 핸들러를 덮지 않도록 범위 한정)
  document.querySelectorAll('#rank .seg, #unkList .seg').forEach(el=>el.onclick=()=>{const p=polys.find(q=>q._r.bid==el.dataset.b);if(p){map.fitBounds(p.getBounds().pad(0.4));p.openPopup();}});
}
function card(){
  const c=SUM.codes[SGG];
  const s1=c.S1||{},s0=c.S0||{};
  const pool=s1.pool_mw, alloc=s1.alloc_mw;
  document.getElementById('card').innerHTML=
   `<b>${NM(SGG)} 요약</b> <span class="mut">${SGG==='ALL'?'252시군 합계':'전국 252시군'} · τ=21m · 분할 없음</span><br>`+
   `① 잠재 물량: S1 <b>${T.mw(s1.seg_mw)}MW</b> / S0 <b>${T.mw(s0.seg_mw)}MW</b>`+
   ` <span class="mut">(≥3MW 블록 ${s1.seg_n||0} / ${s0.seg_n||0}개)</span><br>`+
   `② 대면적: 50MW↑ <b>${s1.ge50_n||0}</b>개 · 100MW↑ <b>${s1.ge100_n||0}</b>개 · 최대 <b>${T.mw(s1.max_mw)}MW</b><br>`+
   `③ 계통 여유(관내 읍면동 합): ${pool!=null?'<b>'+T.mw(pool)+'MW</b>':'<span class="mut">미확보</span>'}`+
   (pool!=null&&alloc!=null?` · 블록 배분 <b>${T.mw(alloc)}MW</b>`:'')+'<br>'+
   `④ Pareto 1등급 <b>${s1.g1_n||0}</b>개 ${T.mw(s1.g1_mw)}MW · 1–3등급 <b>${s1.g3_n||0}</b>개 ${T.mw(s1.g3_mw)}MW<br>`+
   `<span class="mut" style="font-size:11px">계통=한전 배전선로 여유(전국 3,741읍면동 실측, 균등분할 보정). `+
   `동 여유는 여러 블록이 공유 -> 순위별 greedy 배분값이 실제 접속 가능량. 합산은 상한 추정.<br>`+
   `시군 경계를 넘는 블록은 관외 읍면동 여유도 쓰므로 '배분'이 '관내 여유'보다 클 수 있음.<br>`+
   `지도 표시는 ${(SUM.min_mw||10)}MW 이상 블록만 (그 미만은 개수가 많아 생략).</span>`;
}
// 계통 여유 단계구분도 (읍면동 pool_mw, 분위 5단계)
// 여유 클수록 진한 초록 (2026-07-16 반전 — "진할수록 접속 여유 많음" 직관)
const CH_BRK=[6,12,19,46], CH_COL=['#edf8e9','#bae4b3','#74c476','#31a354','#006d2c'];
const chColor=v=>v==null?'#eee':v<CH_BRK[0]?CH_COL[0]:v<CH_BRK[1]?CH_COL[1]:v<CH_BRK[2]?CH_COL[2]:v<CH_BRK[3]?CH_COL[3]:CH_COL[4];
let choLayer=null,choOn=false;
function toggleChoro(){
  choOn=!choOn;
  document.getElementById('choroBtn').classList.toggle('on',choOn);
  document.getElementById('choroBtn').textContent=choOn?ML().choroOff:ML().choroOn;
  document.getElementById('legend').style.display=choOn?'block':'none';
  if(choOn && !choLayer){
    fetch('data_v3/grid_choropleth.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(fc=>{
      choLayer=L.geoJSON(fc,{style:f=>({fillColor:chColor(f.properties.pool_mw),weight:.6,color:'#fff',fillOpacity:.6}),
        onEachFeature:(f,l)=>{const p=f.properties.pool_mw,u=Math.floor(p/T.UNIT.mw);
          l.bindTooltip(ML().choroTip(f.properties.name,p,u,f.properties.capped));}});
      if(choOn){choLayer.addTo(map);choLayer.bringToBack();}  // 로딩 중 꺼짐 클릭 시 유령 표시 방지
    }).catch(()=>{  // 무음 실패 방지 (2026-07-22): 버튼 상태 복원 + 범례에 실패 사유 표시
      choOn=false;choLayer=null;
      document.getElementById('choroBtn').classList.remove('on');
      document.getElementById('choroBtn').textContent=ML().choroOn;
      document.getElementById('legend').style.display='block';
      document.getElementById('legend').innerHTML=`<span class="mut">${ML().choroFail}</span>`;});
  } else if(choLayer){ choOn?choLayer.addTo(map):map.removeLayer(choLayer); if(choOn)choLayer.bringToBack(); }
  const brk=['~6','6–12','12–19','19–46','46+'];
  document.getElementById('legend').innerHTML=`<span class="mut">${ML().legTitle}</span><br>`+
    brk.map((b,i)=>`<span style="display:inline-block;width:12px;height:12px;background:${CH_COL[i]};vertical-align:middle"></span> ${b} `).join('')+
    `<br><span class="mut" style="font-size:11px">${ML().legNote1}</span>`+
    `<br><span class="mut" style="font-size:11px">${ML().legNote2}</span>`;
}
document.getElementById('choroBtn').onclick=toggleChoro;
// ── 저소유 꼬리 강조 토글 (외곽선만 재적용 — 채움·가시성은 refresh 관할이라 불변) ──
document.getElementById('tailBtn').onclick=function(){
  tailOn=!tailOn;
  this.classList.toggle('on',tailOn);
  this.textContent=tailOn?ML().tailOff:ML().tailOn;
  polys.forEach(p=>p.setStyle(outline(p._r)));
};
// ── 간척지구 레이어 (grid_choropleth 재활용 — 간척 읍면 dong만 필터, 기본 꺼짐) ──
let recLayer=null,recOn=false;
function toggleRec(){
  recOn=!recOn;
  const btn=document.getElementById('recBtn');
  btn.classList.toggle('on',recOn);
  btn.textContent=recOn?ML().recOff:ML().recOn;
  document.getElementById('recNote').style.display=recOn?'block':'none';
  if(recOn && !recLayer){
    fetch('data_v3/grid_choropleth.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(fc=>{
      const sub={type:'FeatureCollection',features:fc.features.filter(f=>RECLAIM_DONG.has(String(f.properties.dong)))};
      recLayer=L.geoJSON(sub,{style:()=>({color:'#dd6b20',weight:2.5,dashArray:'6 4',fillColor:'#dd6b20',fillOpacity:.07}),
        onEachFeature:(f,l)=>l.bindTooltip(ML().recTip(f.properties.name))});
      if(recOn)recLayer.addTo(map);  // 로딩 중 꺼짐 클릭 시 유령 표시 방지 (choro와 동일 패턴)
    }).catch(()=>{
      recOn=false;recLayer=null;
      btn.classList.remove('on');btn.textContent=ML().recOn;
      document.getElementById('recNote').style.display='block';
      document.getElementById('recNote').innerHTML=`<span class="mut">${ML().recFail}</span>`;});
  } else if(recLayer){ recOn?recLayer.addTo(map):map.removeLayer(recLayer); }
}
document.getElementById('recBtn').onclick=toggleRec;
document.addEventListener('click',e=>{
  if(e.target.classList.contains('scn')){document.querySelectorAll('.scn').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');SCN=e.target.dataset.v;load();}
  if(e.target.classList.contains('tf')){document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');MWMIN=parseInt(e.target.dataset.v);refresh();}
});
document.getElementById('coreBtn').addEventListener('click',function(){
  coreOn=!coreOn;this.textContent=coreOn?'끄기':'켜기';this.classList.toggle('on',coreOn);
  drawCores();});
document.getElementById('coreOnly').addEventListener('click',function(){
  coreOnly=!coreOnly;this.textContent=coreOnly?'전체 블록 다시 보기':'이것만 보기';
  this.classList.toggle('on',coreOnly);
  if(coreOnly){coreOn=true;
    const b=document.getElementById('coreBtn');b.textContent='끄기';b.classList.add('on');}
  refresh();
  if(coreOnly){
    const vis=coreLayer.getLayers().filter(l=>l._vis);   // drawCores가 그룹 기준으로 판정
    if(vis.length) map.fitBounds(L.featureGroup(vis).getBounds().pad(0.15));}
  });
document.getElementById('sggSel').addEventListener('change',e=>{
  const wasAll=(SGG==='ALL'), v=e.target.value;
  if(v==='ALL50'||v==='ALL100'){SGG='ALL';ALLMIN=(v==='ALL100')?100:50;MWMIN=ALLMIN;}
  else {SGG=v; if(wasAll) MWMIN=0;}   // 시군 모드는 전체 규모부터
  document.querySelectorAll('.tf').forEach(x=>x.classList.toggle('on',parseInt(x.dataset.v)===MWMIN));
  load();});
</script></body></html>
